# Container Manager project "projectionist". Host paths are mounted at the SAME paths inside the container, so
# paths in Plex, Jellyfin, logs and the state DB mean the same file everywhere.
name: projectionist
services:
  projectionist:
    image: projectionist:latest # built with make image, shipped with `docker save | docker load`
    container_name: projectionist
    network_mode: host # Plex 127.0.0.1:32400, Jellyfin 127.0.0.1:8096, /health on 127.0.0.1:8097
    restart: unless-stopped
    # Docker's default 10 s would SIGKILL a health stage in the middle of restarting Jellyfin (a 120 s stop grace,
    # then the start). Other stages return promptly on SIGTERM (stage.Stage's contract), so they exit as before.
    stop_grace_period: 3m
    user: "0:0" # renames must keep each file's owner and set Synology ACLs; capabilities are trimmed below
    group_add: ["937"] # videodriver: owns /dev/dri/renderD128
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    cap_drop: [ALL]
    cap_add:
      - CHOWN        # new files take the source file's owner
      - DAC_OVERRIDE # write into share folders whatever their owner
      - FOWNER       # chmod/xattr (ACL) on files not owned by root
      - KILL         # stop a timed-out GPU self-test that runs as the Plex user
      - SETUID       # run Plex's transcoder as the Plex user for its GPU self-test
      - SETGID
    security_opt: ["no-new-privileges:true"]
    # 6 GB / 4 cores shared with Plex and Jellyfin: they win any contention; a runaway encode cannot starve them.
    mem_limit: 1g
    cpu_shares: 256
    read_only: true
    tmpfs: [/tmp]
    volumes:
      # Paths as in config.example.toml: change them to your NAS's, here and in the config alike.
      - /volume1/docker/projectionist/config:/config:ro
      - /volume1/docker/projectionist/state:/state
      # The only writable media mount: renames, 4K copies, .details, subtitles.
      - /volume1/media:/volume1/media
      # Synology's Plex package: Preferences.xml (token, GPU settings), its log, its codecs and VA driver: read-only.
      - /volume1/PlexMediaServer/AppData/Plex Media Server:/volume1/PlexMediaServer/AppData/Plex Media Server:ro
      - /volume1/@appstore/PlexMediaServer:/volume1/@appstore/PlexMediaServer:ro
      # Plex's library database (subtitles' plex_db): SQLite's readers share its -shm, so its folder is writable.
      - type: bind
        source: /volume1/PlexMediaServer/AppData/Plex Media Server/Plug-in Support/Databases
        target: /volume1/PlexMediaServer/AppData/Plex Media Server/Plug-in Support/Databases
        bind: { create_host_path: false }
      # projectionist's own folders beside the media: the GPU sample, the Plex backups and customizations export,
      # the poster and subtitle archives, remote4k's STATUS.txt, appbackup's versions, the unzipped Letterboxd exports.
      - /volume1/projectionist:/volume1/projectionist
      # health stage: inspect containers, restart the ones in [stages.health].restartable. The socket is root on the
      # host and ":ro" would not limit its API; the allow-list in code is the bound.
      - /var/run/docker.sock:/var/run/docker.sock
      # health: the app-data volume's mount, fullness and top-level entries (volume2); appbackup reads its roots here.
      # The superblock's own rw/ro still shows through this read-only bind, so health sees a read-only remount.
      - { type: bind, source: /volume2, target: /volume2, read_only: true, bind: { create_host_path: false } }
      # appbackup: SQLite's online backup opens each listed database's -shm read-write, so their folders are writable.
      - { type: bind, source: /volume2/apps/jellyfin, target: /volume2/apps/jellyfin, bind: { create_host_path: false } }
    secrets: [jellyfin_key, tmdb_read_token, tmdb_api_key, fanart_api_key, ai_gateway_api_key] # /run/secrets/<name>, read-only
    # Optional, for subtitles' keyed providers (one without its files is skipped): append subsource_api_key, or
    # opensubtitles_api_key, opensubtitles_username and opensubtitles_password, and uncomment their entries below. A
    # listed secret whose file is missing stops the container from starting.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

secrets:
  jellyfin_key:
    file: /volume1/docker/projectionist/secrets/jellyfin_key # root:root 0600
  tmdb_read_token: # TMDB v4 read-access token; the v3 key below is the fallback
    file: /volume1/docker/projectionist/secrets/tmdb_read_token
  tmdb_api_key:
    file: /volume1/docker/projectionist/secrets/tmdb_api_key
  fanart_api_key:
    file: /volume1/docker/projectionist/secrets/fanart_api_key
  ai_gateway_api_key: # the AI gateway's key: every model call whose task names no API of its own ([llm] key_file)
    file: /volume1/docker/projectionist/secrets/ai_gateway_api_key
  # subsource_api_key: # subtitles: SubSource, a free key (subsource.net, My Profile)
  #   file: /volume1/docker/projectionist/secrets/subsource_api_key
  # opensubtitles_api_key: # subtitles: OpenSubtitles.com, a free consumer key (opensubtitles.com/en/consumers)
  #   file: /volume1/docker/projectionist/secrets/opensubtitles_api_key
  # opensubtitles_username: # the free opensubtitles.com user it logs in as (20 downloads a day)
  #   file: /volume1/docker/projectionist/secrets/opensubtitles_username
  # opensubtitles_password:
  #   file: /volume1/docker/projectionist/secrets/opensubtitles_password
