# Container Manager project "projectionist". Host paths are mounted at the SAME paths inside the container, so
# paths in Plex, Jellyfin, logs and the state DB mean the same file everywhere.
name: projectionist
services:
  projectionist:
    image: projectionist:latest # built on the Mac (make image), shipped with `docker save | docker load`
    container_name: projectionist
    network_mode: host # Plex 127.0.0.1:32400, Jellyfin 127.0.0.1:8096, /health on 127.0.0.1:8097
    restart: unless-stopped
    user: "0:0" # renames must keep each file's owner and set Synology ACLs; capabilities are trimmed below
    group_add: ["937"] # videodriver: owns /dev/dri/renderD128
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    cap_drop: [ALL]
    cap_add:
      - CHOWN        # new files take the source file's owner
      - DAC_OVERRIDE # write into share folders whatever their owner
      - FOWNER       # chmod/xattr (ACL) on files not owned by root
      - KILL         # stop a timed-out GPU self-test that runs as the Plex user
      - SETUID       # run Plex's transcoder as the Plex user for its GPU self-test
      - SETGID
    security_opt: ["no-new-privileges:true"]
    # 6 GB / 4 cores shared with Plex and Jellyfin: they win any contention; a runaway encode cannot starve them.
    mem_limit: 1g
    cpu_shares: 256
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - /volume1/docker/projectionist/config:/config:ro
      - /volume1/docker/projectionist/state:/state
      # The only writable media mount: renames, 4K copies, .details, subtitles.
      - /volume1/media:/volume1/media
      # Preferences.xml (token, GPU settings), Plex's log, its codecs and VA driver: read-only.
      - /volume1/PlexMediaServer/AppData/Plex Media Server:/volume1/PlexMediaServer/AppData/Plex Media Server:ro
      - /volume1/@appstore/PlexMediaServer:/volume1/@appstore/PlexMediaServer:ro
      # GPU self-test sample and the old scripts' state files (imported once at cutover): read-only.
      - /volume1/PlexMediaServer/scripts:/volume1/PlexMediaServer/scripts:ro
      - /volume1/PlexMediaServer/remote4k:/volume1/PlexMediaServer/remote4k # STATUS.txt the owner reads
      # The Python renamers' logs (undo.tsv, undo_auto.tsv): each video's original name for its .details note.
      # Read-only; the rename stage's own logs live under /volume1/media/.projectionist/rename.
      - /volume1/PlexMediaServer/rename:/volume1/PlexMediaServer/rename:ro
      # ssdmirror: the USB SSD, and fill.py's folder whose PROGRESS.txt it takes over. DSM's mounts are private (no
      # propagation): stop the container before ejecting the SSD and start it after plugging it back in. Started
      # without the SSD, Docker makes an empty folder at that path and the stage refuses ("SSD not mounted").
      - /volumeUSB1/usbshare1-2:/volumeUSB1/usbshare1-2
      - /volume1/PlexMediaServer/ssd-copy:/volume1/PlexMediaServer/ssd-copy
      # subtitles: subfetch2.py's quota.csv and downloads.csv, imported once at cutover (OpenSubtitles' per-IP quota).
      # rename: the aligner's log2.csv (its aligned copy takes the primary subtitle name).
      - /volume1/PlexMediaServer/subtitle-downloads:/volume1/PlexMediaServer/subtitle-downloads:ro
    secrets: [jellyfin_key, tmdb_read_token, tmdb_api_key, fanart_api_key] # /run/secrets/<name>, read-only
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

secrets:
  jellyfin_key:
    file: /volume1/docker/projectionist/secrets/jellyfin_key # root:root 0600
  tmdb_read_token: # TMDB v4 read-access token; the v3 key below is the fallback
    file: /volume1/docker/projectionist/secrets/tmdb_read_token
  tmdb_api_key:
    file: /volume1/docker/projectionist/secrets/tmdb_api_key
  fanart_api_key:
    file: /volume1/docker/projectionist/secrets/fanart_api_key
