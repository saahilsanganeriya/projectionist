# projectionist config. Mounted read-only at /config/projectionist.toml.
# Secrets are never written here: only the paths of the files that hold them.

listen   = "127.0.0.1:8097"          # /health and /metrics; host network, so keep it on loopback
state_db = "/state/projectionist.db" # SQLite on the btrfs volume (never on SMB/NFS)
timezone = "America/Los_Angeles"     # used only for stage windows; logs and the DB are UTC
owners   = ["saahilsanganeriya", "saahil"] # Plex, Jellyfin accounts whose viewing never pauses a job

[log]
format = "text" # key=value lines; "json" for JSON lines
level  = "info"

[plex]
url         = "http://127.0.0.1:32400"
preferences = "/volume1/PlexMediaServer/AppData/Plex Media Server/Preferences.xml" # holds the token; read per request
timeout     = "20s"

[jellyfin]
url      = "http://127.0.0.1:8096"
key_file = "/run/secrets/jellyfin_key"
timeout  = "20s"

[ffmpeg]
dir    = "/usr/lib/jellyfin-ffmpeg" # inside the image; same build as the Jellyfin container
device = "/dev/dri/renderD128"

# One table per stage. Common keys: enabled (default true when the table exists), every, window ("HH:MM-HH:MM",
# in timezone, may wrap midnight). Everything else in the table belongs to the stage.
# [stages.example]
# every  = "15m"
# window = "02:00-08:00"

# Keeps Plex and Jellyfin transcoding on the GPU; replaces scripts/gpu_guard.py (DSM task 8).
[stages.gpu-guard]
every           = "15m"
plex_device     = "8086:3185@0000:00:02.0" # Plex's id for the UHD 600 ("Auto" picks an empty device on 1.43)
plex_log        = "/volume1/PlexMediaServer/AppData/Plex Media Server/Logs/Plex Media Server.log"
plex_app_data   = "/volume1/PlexMediaServer/AppData/Plex Media Server"
plex_transcoder = "/volume1/@appstore/PlexMediaServer/Plex Transcoder"
plex_uid        = 297536 # `id PlexMediaServer` on the NAS
plex_gid        = 297536
plex_groups     = [297536, 999, 937] # 937 = videodriver, owner of /dev/dri/renderD128
sample          = "/volume1/PlexMediaServer/scripts/gpu_sample.mkv"
self_test_every = "24h"
legacy_state    = "/volume1/PlexMediaServer/scripts/gpu_guard.state.json" # imported once at cutover

# Small 4K copies of the films in the Plex playlist "Remote 4K"; replaces scripts/remote4k.py (DSM task 9).
[stages.remote4k]
every           = "15m"
playlist        = "Remote 4K"
label           = "2160p 14Mbps"
small_kbps      = 20000
work_dir        = "/volume1/media/.projectionist/remote4k" # same share as the library: publish = one rename
status_file     = "/volume1/PlexMediaServer/remote4k/STATUS.txt"
default_section = 4

# The most artistic poster for every movie, show and season, on Jellyfin and Plex; replaces posters/posters.py.
# Candidates: the owner's poster (pre-rename backup), TMDB (direct) and fanart.tv. Judge: Claude on the owner's own
# Anthropic key, one vision call per title; a backlog goes through Message Batches (half price). Secrets are files in
# secrets_dir: tmdb_read_token (or tmdb_api_key), fanart_api_key (optional), anthropic_api_key.
[stages.posters]
every              = "6h"
dry_run            = false
model              = "haiku:latest"  # the newest model whose id contains "haiku", checked daily
budget_usd         = 5               # all judge calls ever; a hard stop
max_tokens         = 400
batch_min          = 25              # fewer titles to judge than this: the normal API
batch_size         = 200
secrets_dir        = "/run/secrets"
cache_dir          = "/state/posters" # thumbnails
owner_items        = "/volume1/PlexMediaServer/backups/customizations/items.json"
owner_posters      = "/volume1/PlexMediaServer/backups/customizations/posters"
owner_backup_db    = "/volume1/PlexMediaServer/backups/pre-rename-20261005T0328Z/com.plexapp.plugins.library.db" # read once
plex_movie_section = 4
plex_tv_section    = 2
sink_index_every   = "24h"           # one item listing per app per day maps titles to the apps' ids
mark               = "poster-curator 2026-10" # EXIF ImageDescription on every uploaded image
