# projectionist config. Mounted read-only at /config/projectionist.toml.
# Secrets are never written here: only the paths of the files that hold them.

listen   = "127.0.0.1:8097"          # /health and /metrics; host network, so keep it on loopback
state_db = "/state/projectionist.db" # SQLite on the btrfs volume (never on SMB/NFS)
timezone = "America/Los_Angeles"     # used only for stage windows; logs and the DB are UTC
owners   = ["saahilsanganeriya", "saahil"] # Plex, Jellyfin accounts whose viewing never pauses a job

[log]
format = "text" # key=value lines; "json" for JSON lines
level  = "info"

[plex]
url         = "http://127.0.0.1:32400"
preferences = "/volume1/PlexMediaServer/AppData/Plex Media Server/Preferences.xml" # holds the token; read per request
timeout     = "20s"

[jellyfin]
url      = "http://127.0.0.1:8096"
key_file = "/run/secrets/jellyfin_key"
timeout  = "20s"

[ffmpeg]
dir    = "/usr/lib/jellyfin-ffmpeg" # inside the image; same build as the Jellyfin container
device = "/dev/dri/renderD128"

# The online sources: identity, episodes, collections, external ids and images come from TMDB directly, artwork
# also from fanart.tv. Plex and Jellyfin are never asked. Responses are cached in state_db for cache_ttl.
[tmdb]
read_token_file = "/run/secrets/tmdb_read_token" # v4 read-access token, sent as a bearer
api_key_file    = "/run/secrets/tmdb_api_key"    # v3 key, used only when the token file is missing or empty
cache_ttl       = "24h"

[fanart]
api_key_file = "/run/secrets/fanart_api_key"
cache_ttl    = "24h"

# One table per stage. Common keys: enabled (default true when the table exists), every, window ("HH:MM-HH:MM",
# in timezone, may wrap midnight). Everything else in the table belongs to the stage.
# [stages.example]
# every  = "15m"
# window = "02:00-08:00"

# Movies collections in Plex and Jellyfin: the owner's backed-up collections + the approved list + new arrivals.
# Facts from the folder names and TMDB; the apps only receive writes. Never removes a member or a collection.
[stages.collections]
every           = "6h"
movies_dir      = "/volume1/media/Movies"
# The owner's 111 collections, frozen once from Plex's customizations export (a one-time migration; Plex is never
# read for them again): config/collections.owner.json in this repo, and their posters copied once beside it.
owner_file      = "/config/collections.owner.json"
poster_dir      = "/config/collection-posters" # <ratingKey>.jpg
approved_file   = "/config/collections.approved.json" # config/collections.approved.json in this repo
plex_section    = 4
sinks           = ["plex", "jellyfin"] # reconciled concurrently; a slow or down app never fails or holds up the run
sink_budget     = "20m" # each app's share of a run; out of time, it triggers the next run, which carries on
call_timeout    = "2m"  # each request, on this stage's own clients ([plex] and [jellyfin] timeouts stay short)
# A director here gets a "zz<name>" collection once their third film is on disk (names as TMDB spells them).
canon_directors = [
  "Paul Greengrass", "Vishal Bhardwaj", "George Miller", "Robert Zemeckis", "Nicolas Winding Refn", "Hayao Miyazaki",
  "Ang Lee", "Todd Haynes", "Lynne Ramsay", "Andrew Stanton", "Kathryn Bigelow", "The Wachowskis", "Joachim Trier",
  "Steve McQueen", "Gus Van Sant", "Gaspar Noé", "Chloé Zhao", "Sean Baker", "Barry Jenkins", "David Lean",
  "Roman Polanski", "David Cronenberg", "Edward Yang", "Alexander Payne", "Kenneth Lonergan", "Miloš Forman",
  "Jacques Demy", "John Carpenter", "Peter Weir", "Robert Wise", "Elaine May", "Julia Ducournau", "Masaki Kobayashi",
  "Pablo Larraín", "Satoshi Kon"
]
# only    = ["Scary Movie"] # reconcile just these collections (gate runs)
# dry_run = true            # log every create/add/sort/poster instead of sending it

# Keeps Plex and Jellyfin transcoding on the GPU; replaces scripts/gpu_guard.py (DSM task 8).
[stages.gpu-guard]
every           = "15m"
plex_device     = "8086:3185@0000:00:02.0" # Plex's id for the UHD 600 ("Auto" picks an empty device on 1.43)
plex_log        = "/volume1/PlexMediaServer/AppData/Plex Media Server/Logs/Plex Media Server.log"
plex_app_data   = "/volume1/PlexMediaServer/AppData/Plex Media Server"
plex_transcoder = "/volume1/@appstore/PlexMediaServer/Plex Transcoder"
plex_uid        = 297536 # `id PlexMediaServer` on the NAS
plex_gid        = 297536
plex_groups     = [297536, 999, 937] # 937 = videodriver, owner of /dev/dri/renderD128
sample          = "/volume1/PlexMediaServer/scripts/gpu_sample.mkv"
self_test_every = "24h"
legacy_state    = "/volume1/PlexMediaServer/scripts/gpu_guard.state.json" # imported once at cutover
plex_timeout    = "5s" # each Plex API call; a slower Plex never fails the run

# Probes Plex, Jellyfin, qBittorrent, the Cloudflare hostnames and the containers; restarts a Jellyfin that stopped
# answering when nobody is playing on it. New: no Python original. Needs /var/run/docker.sock (compose.yaml).
[stages.health]
every                 = "5m"
timeout               = "30s"          # per probe, all at once (Cloudflare: up to 9.8 s seen); Plex/Jellyfin: also [plex]/[jellyfin] timeout
fail_threshold        = 3              # consecutive failed runs before an alert (and a restart)
restart_cooldown      = "1h"           # at most one restart per container per cooldown; at least 1h
restartable           = ["jellyfin"]   # the ONLY containers projectionist may restart; left out or [] = alert only
docker_socket         = "/var/run/docker.sock"
jellyfin_container    = "jellyfin"
qbittorrent_container = "qbittorrent"
qbittorrent_url       = "http://127.0.0.1:8080" # 403 counts as up: the WebUI answers and wants a login
# Plex's speed: the Movies and Home hubs are timed every run; Plex's Optimize Database runs once (at most daily, no
# guest watching) when they are slower than plex_slow 3 runs in a row, or after a big batch of library changes.
plex_movies_section   = 4
plex_slow             = "5s"           # a cold Movies tab took 26.8 s on a fragmented database, 17 ms after an optimize
plex_batch            = 500            # details notes + rename moves + Plex collection edits since the last optimize
plex_optimize_window  = "03:00-06:00"  # when an optimize may start (timezone above); the 2026-10-05 one took 4 min 21 s
[stages.health.public] # URL = the status it must answer through the Cloudflare tunnel; redirects are not followed
"https://jellyfin.example.com"    = 302
"https://plex.example.com"    = 401
"https://nas.example.com" = 200

# The owner's Letterboxd diary → projectionist's watch record (jfsync, the one writer, carries it to Plex and
# Jellyfin), and his watchlist as a "Watchlist" collection in both apps, promoted to his Plex Home.
[stages.letterboxd]
every          = "30m"                    # the RSS feed is read every run; grid pages once per pages_every. Letterboxd is paced
                                          # at one request per 2 s for the whole process, shared with lists and tonight
user           = "saahilsan"
max_fetches    = 400                      # Letterboxd requests per run; the first lookups resume over a few runs
pages_every    = "24h"                    # watchlist + watched-films grid crawl
export_dir     = "/volume1/docker/projectionist/data/letterboxd" # unzipped account exports; the newest folder wins
movies_dir     = "/volume1/media/Movies"
missing_file   = "/volume1/media/_watchlist-missing.txt" # watchlist films not on the NAS; "" = none
sink_refresh   = "24h"                    # re-read what Plex (one paged listing) and plex.tv hold this often; Plex also before a collection write, once a day per film
jellyfin_refresh = "24h"                  # re-read what Jellyfin holds this often (15-30 s a read); also before a collection write, once a day per film
plex_section   = 4
jellyfin_user  = "saahil"
person         = "saahil"                 # the owner in the watch record: his name in jfsync's users (jfsync alerts on any other)
# false: only diary entries he logs after this stage first runs become watch events. true: also the export and the
# feed's backlog (on 2026-10-05 about 465 Plex watched marks and 649 ratings, which Plex shows his friends: watch
# history to friends of friends, ratings to friends). His decision.
history        = false
collection     = "Watchlist"              # "" = no Watchlist collection
plex_watchlist = false                    # also mirror onto his plex.tv watchlist (his Plex friends can see it)
run_budget     = "25m"                    # no Plex/Jellyfin/plex.tv call starts later than this into a run; keep it under every
dry_run        = false                    # count events and collection writes only

# Small 4K copies of the films listed as "Remote 4K" (Plex playlist, Jellyfin playlist or Jellyfin collection);
# replaces scripts/remote4k.py (DSM task 9).
[stages.remote4k]
every        = "15m"
playlist     = "Remote 4K"
label        = "2160p 14Mbps"
small_kbps   = 20000
work_dir     = "/volume1/media/.projectionist/remote4k" # same share as the library: publish = one rename
status_file  = "/volume1/PlexMediaServer/remote4k/STATUS.txt"
list_timeout = "30s" # an app slower than this leaves its half of the list empty for that run (a busy Plex needs > 5 s)

# Watch state (played, play count, resume position, rating) kept the same in Plex and Jellyfin from projectionist's
# own record: Plex's webhook and the Jellyfin Webhook plugin push plays to /hooks/{plex,jellyfin} (a Jellyfin push
# carries no rating: ratings come from Plex and Letterboxd); the history that lived only inside the apps is imported
# once (newest Plex DB backup copy, Jellyfin played/resumable/rated items). The listings and the imports wait while
# anyone but the owner is watching; the writes do not.
[stages.jfsync]
every          = "5m"
apply          = true # false: plan only (no app writes); plan_file lists what would be written
# plan_file    = "/volume1/PlexMediaServer/projectionist-test/jfsync/plan.tsv"
movies_section = 4
tv_section     = 2
# One item listing per app per day (the sources rule) maps app ids to the library's {tmdb-N} identity. It runs after
# the run's writes (Plex's in pages of 1,000); a failed one alerts and is tried again a day later, the old listing staying in
# use. A play of an item added since the last listing waits for the next one. Only an app never listed retries sooner.
address_every  = "24h"
list_timeout   = "30m" # per request; 2026-10-05 on the loaded NAS, mid Jellyfin first scan: Jellyfin 4m56s-9m04s, Plex 4m55s-5m41s
# Mount read-only; the newest *.db is read once per person. Take a fresh copy (backup_plex_db.sh) just before the
# first run: plays after the copy and before the webhook is registered are not recorded.
plex_backups   = "/volume1/PlexMediaServer/backups"
webhook_url    = "http://127.0.0.1:8097/hooks/plex" # registered on the owner's plex.tv account; "" = leave it alone
users = [
  { name = "saahil", plex = "saahilsanganeriya", jellyfin = "saahil" },
  { name = "roger",  plex = "roger",             jellyfin = "roger" },
]

# Keeps "<dir>/.details/<video>.txt" true for every video in the scheme, from ffprobe and the rename logs;
# replaces rename/write_details_files.py. Bounds are per run; probed and scanned files are cached.
[stages.details]
every             = "15m"
library           = "/volume1/media"
sections          = ["Movies", "TV"]
# Rename logs, oldest first: the Python renamers', the rename stage's legacy copies of them, then its own. A missing
# log is skipped and a row read twice counts once, but a run that finds no move row at all fails ([] = no logs).
undo_logs         = ["/volume1/PlexMediaServer/rename/undo.tsv", "/volume1/PlexMediaServer/rename/undo_auto.tsv",
                     "/volume1/media/.projectionist/rename/legacy-undo.tsv", "/volume1/media/.projectionist/rename/legacy-undo_auto.tsv",
                     "/volume1/media/.projectionist/rename/undo.tsv"]
max_probes        = 400  # new ffprobe runs per run
max_peak_scans    = 2    # whole-file packet scans per run (files above peak_above_kbps only; ~20 min per 50 GB)
max_decode_checks = 60   # 3 x 5 s decode samples per file
peak_above_kbps   = 20000
retry_unreadable  = "24h"
# notes_root      = "/volume1/PlexMediaServer/projectionist-test/details/notes" # dry run: notes into a mirror tree
# paths_file      = "/path/to/list.txt"                                          # only these videos

# Keeps Movies/ and TV/ in the naming scheme (replaces rename/rename_engine.py + apply_ops.py and autorename.py).
# Identity from the names and TMDB (env.TMDB, direct); never from Plex or Jellyfin.
[stages.rename]
every        = "15m"
root         = "/volume1/media"
mode         = "apply" # "plan": write ops.tsv, review.tsv, problems.tsv to plan_dir and touch nothing; "undo": replay undo_log backwards
plan_dir     = "/volume1/media/.projectionist/rename/plan"
undo_log     = "/volume1/media/.projectionist/rename/undo.tsv" # apply_ops.py's format: either tool can undo the other's moves
undo_units   = [] # undo mode: only these units (e.g. "movie:tmdb-348"); empty = the whole log
redo_undone  = false # false: a file undo put back stays until you rename or move it; true: apply plans it again
ghost_logs   = ["/volume1/media/.projectionist/rename/legacy-undo.tsv", "/volume1/media/.projectionist/rename/legacy-undo_auto.tsv"]
review_file  = "/volume1/media/_needs-review.txt"
aligned_log  = "/volume1/PlexMediaServer/subtitle-downloads/log2.csv" # the aligner's copy wins the primary subtitle name
sublang_file = "" # optional JSON {path: {lang, sdh}} for subtitles whose language neither name nor text gives
notify       = true  # tell Jellyfin which folders changed (one /Library/Media/Updated push per run; Plex watches the disk)
quiet        = "10m" # a folder written to more recently is still arriving

# An English text subtitle beside every movie and episode; replaces scripts/sub_stats.py and scripts/subfetch2.py.
# A video carrying an embedded English text track already has English subtitles (the players show it, and the audit
# counts it): it is skipped, never opened. Cheap first: a subtitle made for the file's own release (its original
# name's group, from the .details note or the rename logs; or an OpenSubtitles file-hash match) is written without
# reading the video once its last cue fits the note's duration and frame rate. Anything else waits in the alignment
# queue, worked while nobody but the owner watches, at most align_per_day titles in any 24 h. Providers are called
# directly, never through Plex: Gestdown (Addic7ed, episodes) and SITEC Subtitles (films) need no key; OpenSubtitles'
# legacy REST API comes last whatever this list's order (180 downloads a day), and is used for a hash match, or when
# no other provider has a candidate; OpenSubtitles.com and Subdl join only when <secrets_dir>/<name>_api_key exists
# (opensubtitles_api_key, subdl_api_key). IMDb and TheTVDB ids come from TMDB. A title waits until every listed free
# provider has answered (OpenSubtitles only when it is the title's one source), so drop a provider that cannot be
# reached from this network (Subdl, 2026-10-05) from the list.
[stages.subtitles]
every         = "6h"
roots         = ["/volume1/media/Movies", "/volume1/media/TV"]
stats_file    = "/state/sub_stats.tsv" # sub_stats.py's TSV over the whole library, refreshed each run
retry_after   = "168h"                 # a title that got no subtitle is searched again after this, then 2, 4, 8x it
workers       = 3                      # titles searched at once; the queue aligns one at a time
max_titles    = 0                      # per run; 0 = every due title
secrets_dir   = "/run/secrets"
alass         = "/usr/local/bin/alass" # the queue: aligns to the audio when there is no English image track, and rescues misfits
providers     = ["gestdown", "sitec", "subdl", "opensubtitles", "opensubtitles-com"]
align_per_day = 20                     # queued titles aligned in any 24 h, counted as each starts reading its video; 0 = none
legacy_quota  = "/volume1/PlexMediaServer/subtitle-downloads" # subfetch2.py's quota files, read once while the store has none
# undo_logs = [...]                    # rename logs for original names a note lacks; default: the details stage's list
# output_dir = "/volume1/PlexMediaServer/projectionist-test/subtitles/out" # test runs: write sidecars here instead

# Five unseen films for tonight, picked once a day by one Claude call over his Letterboxd ratings and reviews; a
# Plex Movies collection "Tonight" promoted to his own Home as the first Movies row (below Continue Watching, On Deck
# and the rows of libraries ordered before Movies), and the same BoxSet in Jellyfin.
# Reconciles every 30 min: a pick he has since watched leaves the row at once.
# daily_cap_usd is a hard cap: the call and its one retry are sized together before the first is sent, each at its
# worst (the cached prompt prefix billed as a cache write, as a retry that misses the 5-minute cache pays it again;
# 2% slack on token counts; all of max_tokens as output), and the candidate list is cut until the pair fits.
[stages.tonight]
every           = "30m"                          # the model is [[llm.policy]]'s
effort          = "medium"                       # sent only to a model that takes it (Haiku 4.5 does not)
max_tokens      = 1000                           # thinking + the JSON; a cut-off answer is retried at effort "low"
daily_cap_usd   = 0.15                           # hard: see the comment above the table
pick_after      = "05:00"                        # in timezone: a new day's picks after this
picks           = 5
max_candidates  = 400                            # unseen films shown, best-ranked first; fewer when the cap needs it
api_key_file    = "/run/secrets/anthropic_api_key"
letterboxd_dir  = "/volume1/docker/projectionist/data/letterboxd" # the export CSVs, or the newest export folder in it
letterboxd_rss  = "https://letterboxd.com/saahilsan/rss/"
movies_dir      = "/volume1/media/Movies"
section         = 4
collection      = "Tonight"
jellyfin_user   = "saahil"
sink_timeout    = "3m"                           # per sink per run; a failed write is retried with backoff
plex_map_timeout = "10m"                         # the daily TMDB id → ratingKey listing; a page took 112 s in a scan

# Real-time trigger: inotify on the library and finished downloads. A top-level folder (a movie, a show, a download)
# that changed and then stayed quiet for `quiet` triggers each stage in `trigger`; each is a reconciler that finds its
# own work. One run = one `sweep` period (walk every root, then follow events), so `every` must be <= `sweep`: the next
# period then starts at once, and a failed start retries after `every`. One watch per folder: 3,278 for these roots
# (2026-10-05, `find` with the ignore rules below), root's other processes hold 90 of fs.inotify.max_user_watches=8192;
# past the limit it alerts and the sweep covers the rest.
[stages.watcher]
every   = "1m"
sweep   = "15m"
quiet   = "3m" # long SMB/rsync copies keep a folder busy; it triggers this long after the last change
roots   = ["/volume1/media/Movies", "/volume1/media/TV", "/volume1/media/_downloads/complete"]
trigger = ["rename", "details", "subtitles", "posters", "collections", "jfsync"]
ignore  = ["@eaDir", "#recycle", "#snapshot", "_archive", "_assets"] # never watched or counted; dot folders (.details) too
partial_suffixes = [".part", ".!qB"] # in-progress files (and dot files): keep a folder busy, never trigger on their own

# Read-only library audit: names outside the scheme, unreadable videos, orphan sidecars, identical copies, episodes
# without English subtitles. Writes <root>/_audit.txt and alerts when a category grows; never moves or deletes.
[stages.audit]
every         = "24h"
window        = "04:00-07:00"
root          = "/volume1/media"          # holds Movies/ and TV/
report        = "/volume1/media/_audit.txt"
max_listed    = 50                             # examples per category in the report
settle        = "15m"                          # a file or folder changed more recently may still be moving: judged next run
probe_workers = 2                              # ffprobes on cache misses, only while no guest is watching
quiet         = ["missing_english_subs"]       # grows with every download until the subtitles stage catches up

# The most artistic poster for every movie, show and season, on Jellyfin and Plex; replaces posters/posters.py.
# Candidates: the owner's poster (from a Plex DB backup and the export taken with it), TMDB and fanart.tv (the shared
# clients). Judge: Claude on the owner's own Anthropic key (secrets_dir/anthropic_api_key), the model chosen by
# [[llm.policy]], one vision call per title; a backlog goes through Message Batches (half price). Off until enabled:
# even with dry_run, judging spends: the 3,023-title backlog costs about $4.70 in batches with Sonnet 5.5 at low
# effort ($0.00155 a title on the 12-title pilot, 2026-10-05), about half that with Haiku 4.5. A batch request holds
# its worst case (about $0.0064) against budget_usd until it settles, so the first run submits about 1,880 titles and
# a later run the rest; that wait is no alert.
[stages.posters]
enabled            = false
every              = "6h"
dry_run            = true            # judge only; review posters_items, then set false to upload
budget_usd         = 12              # all judge calls ever; a hard stop
max_tokens         = 1024            # thinking included
batch_min          = 25              # fewer titles to judge than this: the normal API
batch_size         = 200
secrets_dir        = "/run/secrets"
cache_dir          = "/state/posters" # thumbnails
# One export: items.json and posters/ from export_customizations.py, and the Plex DB backup taken with them. Pointing
# these at a newer export (before dry_run = false) merges it in: its uploads and picks win, its defaults never do.
owner_items        = "/volume1/PlexMediaServer/backups/customizations/items.json"
owner_posters      = "/volume1/PlexMediaServer/backups/customizations/posters"
owner_backup_db    = "/volume1/PlexMediaServer/backups/pre-rename-20261005T0328Z/com.plexapp.plugins.library.db"
plex_movie_section = 4
plex_tv_section    = 2
sink_index_every   = "24h"           # one item listing per app per day maps titles to the apps' ids; a title an app
                                     # re-created under a new id (Jellyfin: any rename) gets its poster again
sink_alert_after   = "72h"           # an app whose listing fails this long raises an alert (its posters wait)
mark               = "poster-curator 2026-10" # EXIF ImageDescription on the images the stage uploads, the owner's own
                                     # uploads excepted; a later export reads a marked upload as the stage's
# Collections: every Movies collection the owner gave no poster (the approved ones, and those arrivals open) gets one:
# a franchise its TMDB collection's or fanart.tv's poster or its most acclaimed film's; a director a textless 1000x1500
# poster composed from a photo (Wikimedia Commons, on-set first, then TMDB). One judge call per collection, about 150
# for the approved list (under $1 with Sonnet 5.5). The owner's collections are never touched. Both files on = collections on.
collections_owner_file    = "/config/collections.owner.json"
collections_approved_file = "/config/collections.approved.json"
collection_dry_run        = true # judge only; review posters_items (keys "collection:<name>"), then set false to upload
collection_budget_usd     = 5    # all collection judge calls ever; a hard stop, apart from budget_usd
director_min_score        = 4    # a director's best photo needs this judge score (1-10), else no poster and an alert
# commons_contact = ""           # a URL or e-mail for Wikimedia's User-Agent policy: 200 requests a minute instead
                                 # of 10 (unset, Wikimedia requests go 6.5 s apart; about 10 per director)

# Letterboxd lists as Plex collections and Jellyfin BoxSets: the canon plus the owner's own public lists, owned films
# in list order, "On the NAS: N of M · seen S · <url>" summaries, generated posters, Plex Home rows for `home`.
# Letterboxd is read politely (one request per 2 s for the whole process, page 1 only of user pages) and cached in
# SQLite. A shelf whose title an owner's collection already has (ignoring case) is named "<list> · Letterboxd", and an
# own list named like a canon shelf "<list> · my list". A shelf whose list is gone (private or deleted, in skip_own,
# dropped from the canon) is deleted from both apps. Shelves keep each list's published order.
[stages.lists]
every            = "24h"
window           = "03:00-08:00"
dry_run          = false      # true: read and count everything, write nothing
only             = []         # shelve only these lists (names); empty = all
letterboxd_user  = "saahilsan"
canon_refresh    = "20h"      # canon list pages are re-read on every daily run: the Top 500 changes as members rate
own_refresh      = "20h"      # the owner's lists, films page and diary feed: daily
export_dir       = "/volume1/docker/projectionist/data/letterboxd" # the unzipped Letterboxd export (lists/*.csv, watched.csv),
                                 # mounted read-only by compose.yaml; missing or empty = an alert; "" = no export
own_lists        = true
skip_own         = ["*private*"] # the owner's lists to leave out: names or slugs, any case, "*" = any text; lists
                                 # private on Letterboxd are never shelved
movies_dir       = "/volume1/media/Movies"
missing_file     = "/volume1/media/_lists-missing.txt"
plex_section     = 4
plex_refresh     = "24h"      # one /library/sections/4/all listing (TMDB id → ratingKey, watched) per day at most
plex_budget      = "30m"      # first build of all shelves: ~2,000 calls; later runs a handful
jellyfin_user    = "saahil"
jellyfin_budget  = "15m"
home             = ["Letterboxd Top 500", "Criterion Collection", "Sight & Sound 2022"] # the owner's own Plex Home rows, in order
home_after       = "movie.recentlyadded"
# To take a shelf away, leave its list out here (skip_own, only, the canon): a shelf deleted by hand in Plex or
# Jellyfin is made again on the next run. A shelf whose summary you rewrite is yours: it stays when its list goes.
# The canon defaults to the lists in lists.go's defaultCanon (checked 2026-10-05: Letterboxd Top 500, Criterion
# Collection, Sight & Sound 2022 and its directors' poll, TSPDT 1000, Best Picture, Palme d'Or); a
# [[stages.lists.canon]] table replaces all of them. A shelf of a canon list no longer named is deleted, if the stage
# made it (its summary starts "On the NAS: "), even with no record of it: the gate-made "Letterboxd Top 250" goes so.
# [[stages.lists.canon]]
# name    = "Criterion Collection"
# url     = "https://letterboxd.com/jbutts15/list/the-complete-criterion-collection/"
# limit   = 0      # keep only the first N (a Top 250 is the Top 500 with limit = 250)
# poster  = ""     # an image file instead of the generated poster

# Which Claude model the stages that call one use, by date: the first rule whose `until` is still in the future wins
# (`until` is exclusive; no `until` = for good). "<family>:latest" is the newest model whose id contains <family>,
# looked up daily in the Models API, so a new model is used the day it ships. This is the default when no rule is set.
[[llm.policy]]
model = "sonnet:latest"
until = 2026-11-05T08:00:00Z # 00:00 PST

[[llm.policy]]
model = "haiku:latest"
